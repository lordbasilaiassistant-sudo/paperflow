# Render Blueprint — one-click deploy of the live paperflow app.
# In the Render dashboard: New > Blueprint, point it at this repo, and set the
# LLM_API_KEY secret when prompted. See docs/DEPLOY.md for the full walkthrough.
services:
  - type: web
    name: paperflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # The extraction endpoint. Defaults target z.ai's free GLM flash tier;
      # any OpenAI-compatible endpoint works.
      - key: LLM_BASE_URL
        value: https://api.z.ai/api/paas/v4
      - key: LLM_MODEL
        value: glm-4.5-flash
      # Disables GLM reasoning tokens (faster, cheaper). Harmless on other providers.
      - key: LLM_EXTRA_BODY
        value: '{"thinking": {"type": "disabled"}}'
      # Docs at/above this confidence (and passing validation) auto-accept;
      # everything else goes to the human review queue.
      - key: ROUTE_THRESHOLD
        value: "0.80"
      # Where uploads, page previews, and the SQLite db live inside the container.
      - key: DATA_DIR
        value: /app/data
      # Your OpenAI-compatible API key. Not stored in the repo — set it in the
      # Render dashboard (sync:false means Render prompts for it on deploy).
      - key: LLM_API_KEY
        sync: false
